<title>Group Cash Flow 2023–2033</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
:root{
  --bg:#f1f5f2; --surface:#fcfdfc; --surface-2:#eaf1ec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#7c7b75;
  --grid:#dde6df; --line:#cfdad2; --accent:#0e6b47; --accent-ink:#ffffff; --band:#0b3d2c; --gold:#c09c2e; --hl-fc:#fbf0d2; --hl-fc-ink:#7a5a00; --hl-act:#d9eee1; --hl-act-ink:#0b5a3b;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --good:#006300; --bad:#c23434;
  --radius:10px;
  --font:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-num:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a9993;
    --grid:#2c2c2a; --line:#3a3a37; --accent:#4fc592; --accent-ink:#0d0d0d; --band:#0f3a2b; --gold:#c9a640; --hl-fc:#3b3218; --hl-fc-ink:#f0cf6a; --hl-act:#143a2a; --hl-act-ink:#7fe0b3;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --good:#0ca30c; --bad:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#9a9993;
  --grid:#2c2c2a; --line:#3a3a37; --accent:#4fc592; --accent-ink:#0d0d0d; --band:#0f3a2b; --gold:#c9a640; --hl-fc:#3b3218; --hl-fc-ink:#f0cf6a; --hl-act:#143a2a; --hl-act-ink:#7fe0b3;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --good:#0ca30c; --bad:#e66767;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--band);border-bottom:3px solid var(--gold);border-radius:var(--radius);padding:16px clamp(16px,2.5vw,26px);color:#fff}
.brand{display:flex;align-items:center;gap:clamp(14px,2vw,22px);min-width:0}
.brand img{height:clamp(44px,6vw,62px);width:auto;display:block;flex:none}
.brand .div{width:1px;align-self:stretch;background:rgba(255,255,255,.25)}
header.top h1{color:#fff} header.top .sub{color:rgba(255,255,255,.75)}
header.top .asof{color:rgba(255,255,255,.7)} header.top .asof b{color:#fff}
@media (max-width:560px){.brand .div{display:none}.brand{flex-wrap:wrap}header.top .asof{text-align:left}}
.lockbrand{background:var(--band);border-bottom:3px solid var(--gold);border-radius:10px;padding:16px;display:grid;place-items:center}
.lockbrand img{height:58px;width:auto}
h1{font-size:clamp(22px,3vw,30px);font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--ink-2);margin:4px 0 0;font-size:13px}
.asof{font-size:12px;color:var(--muted);text-align:right}
.asof b{color:var(--ink-2);font-weight:500}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink-2);font:700 16px "Times New Roman",Times,serif;letter-spacing:.01em;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab .n{font:600 11px var(--font-num);color:var(--muted)}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] .n{color:var(--accent-ink);opacity:.75}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-left:auto}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:500 13px var(--font);padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.projsel{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.projsel .lbl{font-size:12px;color:var(--ink-2)}
label.yr{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
select{font:500 13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
select:disabled{opacity:.45}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:13px;color:var(--ink-2)}
.kpi .v{font:600 clamp(20px,2.4vw,26px)/1.1 var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.key{border-color:var(--accent)}
.kbtn{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.kbtn:hover{border-color:var(--accent)}
.kbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.kbtn .more{font-size:12px;font-weight:600;color:var(--accent);margin-top:2px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dclose{font:inherit;font-size:13px;color:var(--ink-2);background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
.dclose:hover{border-color:var(--accent);color:var(--ink)}
/* current month columns on the Cash Flow page */
.tablewrap th.hl-fc,.tablewrap td.hl-fc{background:var(--hl-fc)!important;font-weight:700}
.tablewrap th.hl-act,.tablewrap td.hl-act{background:var(--hl-act)!important;font-weight:700}
.tablewrap thead th.hl-fc{color:var(--hl-fc-ink);font-size:14.5px;box-shadow:inset 0 4px 0 var(--gold),inset 0 -1px 0 var(--line)}
.tablewrap thead th.hl-act{color:var(--hl-act-ink);font-size:14.5px;box-shadow:inset 0 4px 0 var(--accent),inset 0 -1px 0 var(--line)}
.tablewrap td.hl-fc{border-left:2px solid var(--gold)}
.tablewrap td.hl-act{border-right:2px solid var(--accent)}
.linkbtn{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.linkbtn:hover{color:var(--accent);text-decoration-color:var(--accent)}
.linkbtn::after{content:" ▸";color:var(--accent);font-size:11px}
.linkbtn[aria-expanded="true"]::after{content:" ▾"}
tbody tr.sel td{background:var(--grid)}
tbody tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tbody tr.lo td{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
tbody tr.lo td span{text-decoration:none;display:inline-block}
.txf{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.txf input[type=search]{font:500 13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:min(320px,100%);flex:1}
.txchips{display:flex;flex-wrap:wrap;gap:6px}
.cbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:4px 11px;font:500 12.5px var(--font);cursor:pointer}
.cbtn:hover{border-color:var(--accent)}
.cbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.neg{color:var(--bad)} .pos{color:var(--good)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h2{font-size:16px;font-weight:600;margin:0}
.card .note{font-size:12.5px;color:var(--muted);margin:0}
.chart{position:relative;height:280px;width:100%}
.chart.tall{height:320px}
.tablewrap{overflow:auto;max-height:min(72vh,780px);border:1px solid var(--line);border-radius:8px;background:var(--surface);overscroll-behavior:contain}
/* frozen panes: header row stays at the top, first column (names) stays at the left, Total stays at the right */
.tablewrap thead th{position:sticky;top:0;z-index:2;box-shadow:inset 0 -1px 0 var(--line)}
.tablewrap tbody td:first-child{z-index:1;box-shadow:inset -1px 0 0 var(--line)}
.tablewrap thead th:first-child{left:0;z-index:4;box-shadow:inset -1px 0 0 var(--line),inset 0 -1px 0 var(--line)}
.tablewrap thead th.totcol{right:0;z-index:3}
.tablewrap tbody td.totcol{z-index:1}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13.5px}
th,td{padding:9px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
tbody tr:nth-child(even) td{background:var(--surface-2)}
tbody tr:hover td{background:var(--grid)}
tbody tr.grp td{font-weight:600;background:var(--surface-2);border-top:1px solid var(--line)}
tbody tr.acct td{background:var(--surface)}
tbody tr.grp:hover td,tbody tr.acct:hover td{background:var(--grid)}
tr.acct td:first-child{padding-left:30px;color:var(--ink-2)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.toggle input{width:16px;height:16px;accent-color:var(--accent)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);white-space:normal;min-width:180px}
th.l,td.l{text-align:left}
thead th{font-weight:600;color:var(--ink-2);background:var(--surface-2)}
thead th:first-child{background:var(--surface-2)}
tr.tot td{font-weight:600;border-top:1px solid var(--line)}
tr.bal td{color:var(--ink-2);font-style:italic}
tbody tr.sub td{font-style:italic;color:var(--ink-2);border-bottom:1px solid var(--line)}
th.totcol,td.totcol{font-weight:600;border-left:2px solid var(--line);position:sticky;right:0;background:var(--surface)}
thead th.totcol{background:var(--surface-2)}
.chip{display:inline-block;font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2)}
.chip.a{background:var(--surface-2)}
.chip.t{border-color:var(--accent);color:var(--accent)}
.chip.f{border-style:dashed}
.chip.c1{border-color:var(--s1);color:var(--s1)} .chip.c2{border-color:var(--s2);color:var(--s2)} .chip.c3{border-color:var(--s3);color:var(--s3)} .chip.c4{border-color:var(--muted)}
details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px}
details>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
details[open]>summary{margin-bottom:10px}
footer{font-size:11.5px;color:var(--muted);max-width:75ch}
.lock{min-height:70vh;display:grid;place-items:center}
.lockcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:10px}
.lockcard h1{font-size:22px}
.lockcard label{font-size:12px;color:var(--ink-2);margin-top:6px}
.lockcard input{font:500 15px var(--font);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lockcard input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lockcard button{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 14px var(--font);padding:10px 14px;cursor:pointer}
.lockmsg{min-height:1.2em;font-size:12.5px;color:var(--bad);margin:0}
.lockfoot{font-size:11.5px;color:var(--muted);margin:4px 0 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

const TEST_PW = /*TESTPW*/null;
const PLAIN = /*PLAIN*/null;

function start(D){
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dmy = s => { const d = s.split('-'); return d[2] + '-' + MON[+d[1]-1] + '-' + d[0]; };
const mLabel = ym => MON[+ym.slice(5,7)-1] + '-' + ym.slice(2,4);
const longMonth = ym => MON[+ym.slice(5,7)-1] + ' ' + ym.slice(0,4);
const N = D.months.length;
const CI = D.currentIdx - 1;                      // current month (actual to date)
const curYear = +D.currentMonth.slice(0,4);
const yearOf = i => +D.months[i].slice(0,4);
const curLabel = longMonth(D.currentMonth);

// how each cash flow line is grouped on the Projects page (edit here if a line belongs elsewhere)
const CATEGORY = {
  'Cash Out Flow G Up Balance':'construction', 'Cash Out Montage Project':'construction', 'Cash Out Flow B.B':'construction',
  'Cash Out Flow Dubai South':'construction', 'Cash Out Umm shaif Mansion':'construction',
  'Vahi Investment':'funding', 'Vahi Montage':'funding', 'Vahi Montage Repayment':'funding'
};
const catOf = l => CATEGORY[l.name] || (l.dir === 'in' ? 'collection' : 'expense');
const CAT_LABEL = {construction:'Construction', expense:'Expenses', collection:'Rent / sale collection', funding:'Funding (investor)'};
const CAT_CHIP = {construction:'c1', expense:'c2', collection:'c3', funding:'c4'};
const PROJECTS = ['Montage','Liwan','The Villa','Group'];
const fcByName = {}; D.forecastLines.forEach(l => fcByName[l.name] = l.v);

const state = {tab:'banks', view:'monthly', year:curYear, project:'Montage', bank:'banks', bankChart:'close', showEmpty:false};
try { const s = JSON.parse(localStorage.getItem('cf-state2')||'{}'); Object.assign(state, s); } catch(e) {}
const h = location.hash.replace('#','');
if (['banks','forecast','avf'].includes(h)) state.tab = h;

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function fmt(n){ if (n===null||n===undefined||isNaN(n)) return '–'; const r = Math.round(n); if (r===0) return '–'; const s = Math.abs(r).toLocaleString('en-US'); return r<0 ? '('+s+')' : s; }
function fmtM(n){ const v = n/1e6; return (Math.abs(v) < 0.05 ? '0' : v.toFixed(1)) + 'M'; }
function cls(n){ return Math.round(n)<0 ? 'neg' : ''; }
function sum(arr, idx){ let s=0; for (const i of idx) s += (arr[i]||0); return s; }
function range(a,b){ const r=[]; for (let i=a;i<=b;i++) r.push(i); return r; }
function statusChip(s){ const c = s==='Actual' ? 'a' : (s==='Actual to date' || s==='Actual + Forecast' ? 't' : (s ? 'f' : '')); return s ? `<span class="chip ${c}">${s}</span>` : ''; }

// page ranges: forecast page = actual months, then forecast from the current month; cash flow 2023–2033 = Oct-2023 (actual) to Dec-2033 (forecast)
const RANGE = { forecast:[0, N-1], cashflow:[0, N-1], projects:[0, N-1] };
// projects shown from a later month (Group from Jan-2026)
const PROJECT_START = {'Group':'2026-01'};
function rangeOf(tab){ const r = RANGE[tab].slice(); if (tab==='projects'){ const k = D.months.indexOf(PROJECT_START[state.project]); if (k > r[0]) r[0] = k; } return r; }
function yearsFor(tab){ const [a,b] = rangeOf(tab); const ys=[]; for (let y=yearOf(a); y<=yearOf(b); y++) ys.push(y); return ys; }
function periods(tab, statusOf){
  const [a,b] = rangeOf(tab); const idxAll = range(a,b);
  if (state.view === 'all'){
    return idxAll.map(i=>({label:mLabel(D.months[i]), idx:[i], closeIdx:i, status:statusOf(i)}));
  }
  if (state.view === 'monthly'){
    return idxAll.filter(i=> yearOf(i)===state.year).map(i=>({label:mLabel(D.months[i]), idx:[i], closeIdx:i, status:statusOf(i)}));
  }
  return yearsFor(tab).map(y=>{ const idx = idxAll.filter(i=>yearOf(i)===y); return {label:String(y), idx, closeIdx:idx[idx.length-1], status: idx.every(i=>statusOf(i)==='Forecast') ? 'Forecast' : idx.some(i=>statusOf(i)==='Forecast') ? 'Actual + Forecast' : (idx.includes(CI) ? 'Actual to date' : 'Actual')}; });
}

// ---------- charts ----------
const charts = [];
function clearCharts(){ while (charts.length) charts.pop().destroy(); }
function baseOptions(){
  return {
    responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{
      legend:{position:'top', align:'start', labels:{color:css('--ink-2'), boxWidth:10, boxHeight:10, usePointStyle:true, pointStyle:'rectRounded', font:{size:11}}},
      tooltip:{callbacks:{label:(c)=> ` ${c.dataset.label}: ${fmt(c.parsed.y ?? c.parsed.x)}`}}
    },
    scales:{
      x:{grid:{display:false}, ticks:{color:css('--muted'), font:{size:10.5}, maxRotation:0, autoSkip:true}, border:{color:css('--line')}},
      y:{grid:{color:css('--grid')}, border:{display:false}, ticks:{color:css('--muted'), font:{size:10.5}, callback:v=> fmtM(v)}}
    }
  };
}
function hbarOptions(label){
  const o = baseOptions(); o.indexAxis = 'y'; o.plugins.legend.display = false;
  o.scales = {x:{grid:{color:css('--grid')}, border:{display:false}, ticks:{color:css('--muted'), font:{size:10.5}, callback:v=>fmtM(v)}},
              y:{grid:{display:false}, ticks:{color:css('--ink-2'), font:{size:11}, autoSkip:false}, border:{color:css('--line')}}};
  o.plugins.tooltip = {callbacks:{label:c=>` ${label}: ${fmt(c.parsed.x)}`}};
  return o;
}
function mk(id, cfg){ const el = document.getElementById(id); if (el) charts.push(new Chart(el, cfg)); }
function inOutChart(id, labels, inS, outS){
  const o = baseOptions(); o.scales.x.stacked = true; o.scales.y.stacked = true;
  mk(id, {type:'bar', data:{labels, datasets:[
    {label:'Cash in', data:inS, backgroundColor:css('--s1'), borderRadius:4, maxBarThickness:34},
    {label:'Cash out', data:outS, backgroundColor:css('--s2'), borderRadius:4, maxBarThickness:34}]}, options:o});
}
function lineChart(id, labels, data, label, color, ps){
  const o = baseOptions(); o.plugins.legend.display = false;
  mk(id, {type:'line', data:{labels, datasets:[{label, data, borderColor:color, backgroundColor:color, borderWidth:2, pointRadius:3, pointHoverRadius:5, tension:0,
    segment:{borderDash: ctx => (ps[ctx.p1DataIndex] && ps[ctx.p1DataIndex].status==='Forecast') ? [5,4] : undefined}}]}, options:o});
}

// ---------- building blocks ----------
function kpi(l, v, s, extraCls, key){ return `<div class="kpi${key?' key':''}"><div class="l">${l}</div><div class="v ${extraCls!==undefined?extraCls:cls(v)}">${typeof v==='number'?fmt(v):v}</div><div class="s">${s||''}</div></div>`; }
function periodTable(ps, rows, firstHead){
  const head = `<tr><th>${firstHead||'AED'}</th>${ps.map(p=>`<th class="${p.hl?'hl-'+p.hl:''}">${p.label}<br>${statusChip(p.status)}</th>`).join('')}<th class="totcol">Total</th></tr>`;
  // Total column: flows are added up; opening shows the first period, balances (closing, cumulative) the last
  const total = r => /\bopen\b/.test(r.cls||'') ? r.vals[ps.findIndex(p=>!p.noTotal)] : /\bbal\b/.test(r.cls||'') ? r.vals[r.vals.length-1] : r.vals.reduce((s,v,k)=>s+(ps[k] && ps[k].noTotal ? 0 : (v||0)),0);
  const body = rows.map(r=> { const tv = r.total !== undefined ? r.total : total(r); return `<tr class="${r.cls||''}"><td>${r.name}</td>${r.vals.map((v,k)=>`<td class="${cls(v)}${ps[k] && ps[k].hl ? ' hl-'+ps[k].hl : ''}">${fmt(v)}</td>`).join('')}<td class="totcol ${cls(tv)}">${fmt(tv)}</td></tr>`; }).join('');
  return `<div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function bankTable(rows, withBank){
  const isEmpty = r => !r.open && !r.close && !r.in && !r.out && !r.move;

  const kept = items.filter(it=>!(skip||[]).includes(it.name) && !(moveOut||[]).includes(it.name));
  const movedItems = items.filter(it=>(moveOut||[]).includes(it.name));
  const movedAt = i => match(i) ? movedItems.reduce((a,it)=>a+(it.v[i]||0),0) : 0;     // shown on another row
  const rows = kept.map(it=>({name:(bare ? '' : prefix+' – ')+niceName(it.name)+sub(src+': '+it.name), vals: ps.map(p=>p.idx.reduce((s,i)=>s+(match(i)?(it.v[i]||0):0),0))}))
    .filter(r=>r.vals.some(v=>Math.round(v)!==0));
  // not split = the whole line in months without a matching breakdown, plus items left out on purpose, plus extra lines folded in
  const extras = D.lines.filter(l=>(extra||[]).includes(l.name));
  const extraAt = i => extras.reduce((a,l)=>a+(l.v[i]||0),0);
  const other = ps.map(p=>p.idx.reduce((s,i)=>s+(match(i) ? (line.v[i]||0) - kept.reduce((a,it)=>a+(it.v[i]||0),0) - movedAt(i) : (line.v[i]||0)) + extraAt(i),0));
  if (other.some(v=>Math.round(v)!==0)) rows.push({name:prefix+' – not split'+sub('tracker amount not in '+src+' (difference)'), vals:other});
  const subNote = [lineName, ...extras.map(l=>l.name)].join(' + ') + (movedItems.length ? ' – ' + movedItems.map(it=>JADAF_NAMES[it.name]||it.name).join(', ') + ' (shown under G Up)' : '');
  rows.push({name:prefix+' – subtotal'+sub(subNote), vals: ps.map(p=>p.idx.reduce((s,i)=>s+(line.v[i]||0)+extraAt(i)-movedAt(i),0)), cls:'sub'});
  rows.movedAt = movedAt;
  return rows;
}

const montageCostRows = ps =>  D.montageSplit ? splitRows(ps, 'Cash Out Montage Project', D.montageSplit.items, D.montageSplit.total, 'Project costs', [], [], MONTAGE_TO_GUP) : null;
const montageInRows = ps => D.montageSplit ? splitRows(ps, 'Cash In Montage Project', D.montageSplit.inItems, D.montageSplit.inTotal, 'Montage collections', ['Jadaf Sale Cash & Current'], MONTAGE_IN_EXTRA) : null;function viewProjects(){

  const label = l => `${SOURCE[l.name] || l.name}<br><span style="font-size:11.5px;color:var(--muted)">${l.name}</span>`;
  const bank = name==='Montage' ? [...D.banks, ...D.outOfControl].filter(r=>/montage/i.test(r.company)).reduce((s,r)=>s+(r.close||0),0) : null;
  const tx = name==='Montage' ? (D.montageTx||[]) : [];
  const txIn = tx.filter(r=>r.amt>0), txOut = tx.filter(r=>r.amt<0);
  const txTable = (rows, title) => rows.length ? `<h2 style="margin-top:6px">${title}</h2><div class="tablewrap"><table><thead><tr><th>From / to</th><th class="l">Date</th><th class="l">Company · account</th><th class="l">Type</th><th>Amount</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.desc||'–'}</td><td class="l">${dmy(r.date)}</td><td class="l">${r.company} · ${r.bank}</td><td class="l">${r.type}</td><td class="${cls(r.amt)}">${fmt(r.amt)}</td></tr>`).join('')}
      <tr class="tot"><td>Total</td><td></td><td></td><td></td><td class="${cls(rows.reduce((s,r)=>s+r.amt,0))}">${fmt(rows.reduce((s,r)=>s+r.amt,0))}</td></tr></tbody></table></div>` : '';
  // rows of the cash in / cash out tables for any set of periods (also used by the box details)
  const inRowsFor = P => [...ins.filter(l=> !(name==='Montage' && MONTAGE_IN_EXTRA.includes(l.name) && D.montageSplit)).flatMap(l=> (name==='Montage' && l.name==='Cash In Montage Project' && montageInRows(P)) ? montageInRows(P) : (PROJ_LINES[name] && l.name===PROJ_LINES[name].inLine && projSplitRows(P, name, 'in')) ? projSplitRows(P, name, 'in') : (name==='Group' && l.name===GROUP_LINES.inLine && groupSplitRows(P, 'in')) ? groupSplitRows(P, 'in') : [{name:label(l), vals:P.map(p=>sum(l.v,p.idx))}])];
  const outRowsFor = P => [...outs.flatMap(l=> (name==='Montage' && l.name==='Cash Out Montage Project' && montageCostRows(P)) ? montageCostRows(P) : (PROJ_LINES[name] && l.name===PROJ_LINES[name].outLine && projSplitRows(P, name, 'out')) ? projSplitRows(P, name, 'out') : (name==='Group' && l.name===GROUP_LINES.outLine && groupSplitRows(P, 'out')) ? groupSplitRows(P, 'out') : (name==='Montage' && l.name==='Cash Out Flow G Up Balance' && D.montageSplit) ? [{name:'G Up – construction contractor<br><span style="font-size:11.5px;color:var(--muted)">Cash Flow Jadaf: Jadaf Construction only</span>', vals:P.map(p=>p.idx.reduce((s,i)=>s+montageConstructionAt(i),0))}, {name:'G Up Balance – payments from G Up accounts<br><span style="font-size:11.5px;color:var(--muted)">Cash Out Flow G Up Balance</span>', vals:P.map(p=>sum(l.v,p.idx))}] : [{name:label(l), vals:P.map(p=>sum(l.v,p.idx))}])];
  const KPIS = {
    inTD:  {title:'Total inflow up to date', dir:'in', end:false},
    inEnd: {title:'Total inflow – end of project', dir:'in', end:true},

  const kbtn = (id, v, s) => { const on = state.projKpi===id;

  const kpiDetail = () => {

    const rows = (k.dir==='in' ? inRowsFor(P) : outRowsFor(P)).filter(r=>r.vals.some(v=>Math.round(v)!==0));

      <div class="tablewrap"><table><thead><tr><th>${k.dir==='in'?'From':'To'}</th>${heads.map(h=>`<th>${h}</th>`).join('')}<th>Share</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.cls||''}"><td>${r.name}</td>${cells(r.vals)}<td>${share(r.vals, /\bsub\b/.test(r.cls||''))}</td></tr>`).join('')}
      <tr class="tot"><td>${k.title}</td>${cells(totals)}<td>100%</td></tr></tbody></table></div></section>`;
  };  set(`
    <div class="projsel">
      <span class="lbl">Project</span>
      <div class="seg" role="group" aria-label="Project">${PROJECTS.map(p=>`<button data-proj="${p}" aria-pressed="${p===name}">${p}</button>`).join('')}</div>
    </div>
    <div class="kpis">
      ${kbtn('inTD', sum(inA, toDate), startTxt+' to '+dmy(D.asOf))}
      ${kbtn('inEnd', sum(inA, range(P0, N-1)), startTxt+' to '+mLabel(D.months[N-1]))}
      ${kbtn('outTD', sum(outA, toDate), startTxt+' to '+dmy(D.asOf))}
      ${kbtn('outEnd', sum(outA, range(P0, N-1)), startTxt+' to '+mLabel(D.months[N-1]))}
    </div>
    ${kpiDetail()}    <section class="card"><h2>${name} – cash in</h2>
      ${periodTable(ps, [...inRowsFor(ps), {name:'Total cash in', vals:inS, cls:'tot'}], 'From')}
    </section>
    <section class="card"><h2>${name} – cash out</h2>
      ${periodTable(ps, [...outRowsFor(ps), {name:'Total cash out', vals:outS, cls:'tot'},
        {name:'Net cash flow', vals:netS, cls:'tot'}, {name:'Cumulative net since '+startTxt, vals:cumS, cls:'bal'}], 'To')}
    </section>
    ${name==='Group' ? loansTable(ps) : ''}
    ${tx.length ? `<section class="card"><h2>${name} – bank transactions ${curLabel}</h2><p class="note">Key Mavens Montage and Premiere accounts in the daily file, to ${dmy(D.asOf)}.</p>${txTable(txIn, 'Money in')}${txTable(txOut, 'Money out')}</section>` : ''}
    ${(name==='Liwan'||name==='The Villa'||name==='Group') ? '' : `
    <section class="card"><h2>${name} – ${curLabel}: forecast vs actual</h2>
      <div class="tablewrap"><table><thead><tr><th>Line</th><th>Actual to date</th><th>Forecast ${mLabel(D.currentMonth)}</th><th>Actual ${mLabel(D.currentMonth)}</th><th>Variance</th></tr></thead><tbody>
      ${lines.map(l=>{ const td = sum(l.v,toDate), f=(fcByName[l.name]||[])[CI]||0, a=l.v[CI]||0, v=a-f;
        return `<tr><td>${label(l)}</td><td class="${cls(td)}">${fmt(td)}</td><td class="${cls(f)}">${fmt(f)}</td><td class="${cls(a)}">${fmt(a)}</td><td class="${v<0?'neg':(v>0?'pos':'')}">${fmt(v)}</td></tr>`; }).join('')}
      <tr class="tot"><td>Total</td><td class="${cls(cons+exp+coll+fund)}">${fmt(cons+exp+coll+fund)}</td><td class="${cls(fcM)}">${fmt(fcM)}</td><td class="${cls(acM)}">${fmt(acM)}</td><td class="${(acM-fcM)<0?'neg':'pos'}">${fmt(acM-fcM)}</td></tr>

  document.querySelectorAll('[data-proj]').forEach(b=> b.addEventListener('click', ()=>{ state.project = b.dataset.proj; render(); }));

// ---------- password lock ----------
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decrypt(pw){
  const te = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(ENC.salt), iterations:ENC.iter, hash:'SHA-256'}, base, 512));
  const iv = b64(ENC.iv), ct = b64(ENC.ct);
  const signed = new Uint8Array(iv.length + ct.length); signed.set(iv); signed.set(ct, iv.length);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32), {name:'HMAC', hash:'SHA-256'}, false, ['verify']);
  if (!(await crypto.subtle.verify('HMAC', macKey, b64(ENC.mac), signed))) throw new Error('wrong password');
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), {name:'AES-CBC'}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name:'AES-CBC', iv}, aesKey, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
(function lock(){
  const form = document.getElementById('lockform'), pw = document.getElementById('pw'), msg = document.getElementById('lockmsg');
  if (PLAIN){ document.getElementById('lock').hidden = true; document.getElementById('app').hidden = false; start(PLAIN); return; }
  document.getElementById('lockfoot').textContent = ENC ? ('Prepared ' + ENC.made + '.') : '';
  if (!ENC){ msg.textContent = 'This file has no data. Create it with "Make Presentation.cmd".'; return; }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)){ msg.textContent = 'This browser cannot open encrypted files. Use Microsoft Edge or Google Chrome.'; return; }
    msg.textContent = 'Opening…';
    try {
      const D = await decrypt(pw.value);
      pw.value = '';
      document.getElementById('lock').hidden = true;
      document.getElementById('app').hidden = false;
      start(D);
    } catch(err) { msg.textContent = 'Wrong password. Try again.'; pw.select(); }
  });
  if (TEST_PW){ pw.value = TEST_PW; form.requestSubmit(); }
})();
